<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABLE — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
    <!-- CSS custom properties + auth styles -->
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        body {
            background: var(--global-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
    </style>
</head>
<body>

    <main class="auth-card">

        <!-- Brand / Logo -->
        <div class="auth-brand">
            <h1 class="auth-logo">ABL<span class="highlight">E</span></h1>
            <p class="auth-tagline">Adaptive Browser-Level Extension</p>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="authForm" autocomplete="off">
            <!-- Email -->
            <div class="auth-input-group">
                <label for="authEmail">Email Address</label>
                <div class="auth-input-wrapper">
                    <input type="email" id="authEmail" class="auth-input" placeholder="admin@able.security">
                </div>
            </div>

            <!-- Password -->
            <div class="auth-input-group">
                <label for="authPassword">Password</label>
                <div class="auth-input-wrapper">
                    <input type="password" id="authPassword" class="auth-input" placeholder="Enter your password">
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Options Row -->
            <div class="auth-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-label">Remember me</span>
                </label>
                <button type="button" class="forgot-link" id="forgotPasswordBtn">Forgot Password?</button>
            </div>

            <!-- Sign In Button -->
            <button type="submit" class="auth-btn-primary" id="signInBtn">
                <span class="btn-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    Sign In
                </span>
            </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
            <span>or continue with</span>
        </div>

        <!-- OAuth Buttons -->
        <div class="auth-oauth-row">
            <button type="button" class="auth-oauth-btn" aria-label="Sign in with Google">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
            </button>
            <button type="button" class="auth-oauth-btn" aria-label="Sign in with Microsoft">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
                    <rect x="13" y="1" width="10" height="10" fill="#7FBA00"/>
                    <rect x="1" y="13" width="10" height="10" fill="#00A4EF"/>
                    <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
                </svg>
            </button>
            <button type="button" class="auth-oauth-btn" aria-label="Sign in with SSO">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="M9 12l2 2 4-4"></path>
                </svg>
            </button>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            <p>Don't have an account? <a href="#">Request Access</a></p>
        </div>

    </main>

    <!-- Forgot Password Modal -->
    <div class="auth-modal-backdrop" id="forgotModal">
        <div class="auth-modal">
            <div class="modal-form" id="modalForm">
                <h3>Reset Password</h3>
                <p class="modal-description">Enter your email address and we'll send you a reset link.</p>
                <div class="auth-input-group">
                    <label for="resetEmail">Email Address</label>
                    <div class="auth-input-wrapper">
                        <input type="email" id="resetEmail" class="auth-input" placeholder="admin@able.security">
                    </div>
                </div>
                <button type="button" class="auth-btn-primary" id="sendResetBtn">
                    <span class="auth-spinner"></span>
                    <span class="btn-text">Send Reset Link</span>
                </button>
                <button type="button" class="modal-cancel" id="modalCancelBtn">Cancel</button>
            </div>
            <div class="modal-success" id="modalSuccess">
                <div class="success-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h4>Check Your Email</h4>
                <p>A password reset link has been sent to your email address.</p>
                <button type="button" class="auth-btn-primary" id="modalDoneBtn">
                    <span class="btn-text">Done</span>
                </button>
            </div>
        </div>
    </div>

<script>
(function () {
    'use strict';

    // --- Navigate to Dashboard ---
    function goToDashboard() {
        window.location.href = 'index.html';
    }

    // --- Sign In: redirect immediately ---
    var authForm = document.getElementById('authForm');
    if (authForm) {
        authForm.addEventListener('submit', function (e) {
            e.preventDefault();
            goToDashboard();
        });
    }

    // --- OAuth buttons: redirect ---
    document.querySelectorAll('.auth-oauth-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            goToDashboard();
        });
    });

    // --- Password Visibility Toggle ---
    var passwordToggle = document.getElementById('passwordToggle');
    var authPassword = document.getElementById('authPassword');
    if (passwordToggle && authPassword) {
        passwordToggle.addEventListener('click', function () {
            var isPassword = authPassword.type === 'password';
            authPassword.type = isPassword ? 'text' : 'password';
            var eyeOpen = passwordToggle.querySelector('.eye-open');
            var eyeClosed = passwordToggle.querySelector('.eye-closed');
            if (eyeOpen && eyeClosed) {
                eyeOpen.style.display = isPassword ? 'none' : 'block';
                eyeClosed.style.display = isPassword ? 'block' : 'none';
            }
        });
    }

    // --- Forgot Password Modal ---
    var forgotModal = document.getElementById('forgotModal');
    var forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
    var modalCancelBtn = document.getElementById('modalCancelBtn');
    var sendResetBtn = document.getElementById('sendResetBtn');
    var modalForm = document.getElementById('modalForm');
    var modalSuccess = document.getElementById('modalSuccess');
    var modalDoneBtn = document.getElementById('modalDoneBtn');

    function openModal() {
        if (!forgotModal) return;
        if (modalForm) modalForm.style.display = 'block';
        if (modalSuccess) modalSuccess.classList.remove('visible');
        var resetEmail = document.getElementById('resetEmail');
        if (resetEmail) resetEmail.value = '';
        forgotModal.classList.add('open');
    }

    function closeModal() {
        if (forgotModal) forgotModal.classList.remove('open');
    }

    if (forgotPasswordBtn) forgotPasswordBtn.addEventListener('click', openModal);
    if (modalCancelBtn) modalCancelBtn.addEventListener('click', closeModal);
    if (modalDoneBtn) modalDoneBtn.addEventListener('click', closeModal);

    if (forgotModal) {
        forgotModal.addEventListener('click', function (e) {
            if (e.target === forgotModal) closeModal();
        });
    }

    if (sendResetBtn) {
        sendResetBtn.addEventListener('click', function () {
            sendResetBtn.classList.add('loading');
            setTimeout(function () {
                sendResetBtn.classList.remove('loading');
                if (modalForm) modalForm.style.display = 'none';
                if (modalSuccess) modalSuccess.classList.add('visible');
            }, 1200);
        });
    }

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
    });
})();
</script>

</body>
</html>
