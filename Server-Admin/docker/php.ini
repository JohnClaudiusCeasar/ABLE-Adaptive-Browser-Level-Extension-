; Production PHP tuning for the ABLE research server.
;
; The deployment target is a Render `free` instance: 512 MB RAM, 0.1 CPU,
; running Apache with mod_php (prefork). Every value below is chosen for
; that budget, not for a generic server.

; ---------------------------------------------------------------------------
; Memory
; ---------------------------------------------------------------------------
; The deployment target is a Render `free` instance: 512 MB RAM, 0.1 CPU.
;
; This is the same limit the container ran under before, because the stock
; php image ships no php.ini and PHP's compiled-in default is 128M. Setting
; it explicitly keeps the limit from drifting if the base image changes, and
; keeps it in step with the worker count below.
;
; The budget on a 512 MB box is roughly: about 60 MB for the OS and Apache,
; about 40 MB of shared opcache, and about 30 MB per worker for the PHP
; runtime and the framework. That leaves the rest for the request itself.
; The heaviest request is the signed policy feed, whose peak is a few times
; the size of the feed; a feed of a hundred thousand domains needs roughly
; 50 MB. Raise this together with MaxRequestWorkers, never on its own.
memory_limit = 128M

; ---------------------------------------------------------------------------
; Opcache
; ---------------------------------------------------------------------------
; The container image is immutable at runtime: code only changes when a new
; image is deployed, which restarts the process anyway. Leaving
; validate_timestamps at its default (1) makes PHP stat() every included
; file on every request for no benefit.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.max_wasted_percentage = 5
opcache.save_comments = 1

; JIT is off on purpose. Laravel's request path is dominated by I/O and
; framework bookkeeping, not by tight numeric loops, so JIT buys nothing
; while costing a slice of the memory budget.
opcache.jit = disable
opcache.jit_buffer_size = 0

; ---------------------------------------------------------------------------
; Realpath cache
; ---------------------------------------------------------------------------
; Laravel resolves a large number of paths per request (view, config,
; translation, class-map lookups). The defaults (4096K / 120s) force a
; filesystem stat on cache expiry.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ---------------------------------------------------------------------------
; Limits
; ---------------------------------------------------------------------------
; Left at the values the stock image already used, so no request that
; worked before stops working.
post_max_size = 8M
upload_max_filesize = 8M
max_input_vars = 2000
max_execution_time = 60

; ---------------------------------------------------------------------------
; Output
; ---------------------------------------------------------------------------
; Gzip the JSON payloads the extension polls. The signed policy feed is
; highly repetitive JSON and compresses extremely well.
zlib.output_compression = Off

; ---------------------------------------------------------------------------
; Sessions and garbage collection
; ---------------------------------------------------------------------------
; Never let a request keep a reference to a large payload for longer than
; it needs it.
zend.enable_gc = On
gc_maxlifetime = 3600
