services:
  - type: web
    name: able-shadow-security
    runtime: docker
    dockerfilePath: ./Server-Admin/Dockerfile
    dockerContext: ./Server-Admin
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "ABLE - Shadow IT Prevention and Egress Data Monitoring"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://able-server-admin.onrender.com
      - key: APP_KEY
        sync: false
      - key: ABLE_SIGNING_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: BOOTSTRAP_SUPERADMIN_PASSWORD
        sync: false
      - key: ABLE_TELEMETRY_POLL_INTERVAL_MS
        value: "30000"
