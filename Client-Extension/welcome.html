<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to ABLE - Adaptive Browser-Level Extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="icons/icon-32.png">
  <style>
    :root {
      --brand-green: #00FF44;
      --brand-black: #000000;
      --text-dark: #1A1A1A;
      --text-muted: #666666;
      --bg-light: #F4F6F8;
      --card-bg: #FFFFFF;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-light);
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-dark);
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Branded background shapes */
    .bg-shape {
      position: fixed;
      background-color: var(--brand-green);
      z-index: 0;
      pointer-events: none;
      opacity: 0.85;
    }

    .top-left-pill {
      top: 40px;
      left: -30px;
      width: 140px;
      height: 28px;
      border-radius: 14px;
    }

    .top-right-pill {
      top: 60px;
      right: -30px;
      width: 160px;
      height: 28px;
      border-radius: 14px;
    }

    .bottom-left-triangle {
      bottom: 0;
      left: 0;
      width: 220px;
      height: 260px;
      clip-path: polygon(0 0, 0% 100%, 100% 100%);
      opacity: 0.7;
    }

    .bottom-right-triangle {
      bottom: 0;
      right: 0;
      width: 240px;
      height: 280px;
      clip-path: polygon(100% 0, 0% 100%, 100% 100%);
      opacity: 0.7;
    }

    /* Success state shown after modal dismissal */
    #welcomeSuccessState {
      display: none;
      position: relative;
      z-index: 10;
      width: 520px;
      max-width: 90vw;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
      padding: 40px 32px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--border-color);
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .success-icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #E6FBF0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border: 3px solid var(--brand-green);
      box-shadow: 0 4px 16px rgba(0, 255, 68, 0.25);
    }

    .success-icon {
      font-size: 38px;
      color: #00B32D;
      line-height: 1;
    }

    .success-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111827;
    }

    .success-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .success-features {
      width: 100%;
      background: #F8FAFC;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 13.5px;
      line-height: 1.6;
      color: #334155;
      border: 1px solid #E2E8F0;
    }

    .success-features ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .success-features li {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .success-features li:last-child {
      margin-bottom: 0;
    }

    .success-features .check {
      color: #00B32D;
      font-weight: bold;
    }

    .success-btn {
      font-family: 'Archivo', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 32px;
      background: var(--brand-green);
      border: 1.5px solid #00DD3B;
      border-radius: 14px;
      color: #000000;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 255, 68, 0.3);
      transition: all 0.15s ease;
    }

    .success-btn:hover {
      filter: brightness(0.95);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Decorative background shapes matching ABLE brand -->
  <div class="bg-shape top-left-pill"></div>
  <div class="bg-shape top-right-pill"></div>
  <div class="bg-shape bottom-left-triangle"></div>
  <div class="bg-shape bottom-right-triangle"></div>

  <!-- State displayed after user finishes the greeting modal -->
  <div id="welcomeSuccessState">
    <div class="success-icon-wrap">
      <span class="success-icon">&#10004;</span>
    </div>
    <h2 class="success-title">You're All Set!</h2>
    <p class="success-subtitle">
      ABLE is now actively protecting your browser against unsafe domains and sensitive data exfiltration.
    </p>
    <div class="success-features">
      <ul>
        <li><span class="check">&#10004;</span> Domain classification and audit logging enabled</li>
        <li><span class="check">&#10004;</span> In-browser confidential data protection ready</li>
        <li><span class="check">&#10004;</span> Real-time risk scoring and advisory alerts active</li>
      </ul>
    </div>
    <button class="success-btn" id="closeWelcomeTabBtn" type="button">Start Browsing</button>
  </div>

  <script src="core/storage.js"></script>
  <script src="content/modal-container.js"></script>
  <script src="content/greeting-modal.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
