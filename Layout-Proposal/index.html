<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABLE Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <h1>ABL<span class="brand-accent">E</span> <span class="version">v0.0.1</span></h1>
            </div>
            
            <div class="action-buttons">
                <i class="fas fa-user-circle"></i>
                <i class="fas fa-cog"></i>
                <i class="fas fa-bell"></i>
            </div>
            
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="">
            </div>
            
            <hr class="divider">
            
            <nav class="nav-menu">
                <a href="#" class="nav-card active">
                    <i class="fas fa-desktop"></i>
                    <span>Dashboard</span>
                    <span class="status-dot"></span>
                </a>
                
                <a href="#" class="nav-card transparent">
                    <i class="fas fa-chart-bar"></i>
                    <span>Egress Logs</span>
                    <span class="status-dot"></span>
                </a>
                
                <a href="#" class="nav-card transparent">
                    <i class="fas fa-chart-line"></i>
                    <span>Security Analytics</span>
                    <span class="status-dot"></span>
                </a>
                
                <a href="#" class="nav-card transparent">
                    <i class="fas fa-shield-alt"></i>
                    <span>Risk Algorithm</span>
                    <span class="status-dot"></span>
                </a>
                
                <a href="#" class="nav-card transparent">
                    <i class="fas fa-user-shield"></i>
                    <span>Policy Algorithm</span>
                    <span class="status-dot"></span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h2>Dashboard</h2>
            </header>
            
            <section class="hero">
                </section>
        </main>
    </div>

</body>
</html>
