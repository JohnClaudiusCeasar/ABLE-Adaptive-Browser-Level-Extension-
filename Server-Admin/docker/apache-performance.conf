# Server-level performance tuning for the ABLE research server.
#
# The deployment target is a Render `free` instance: 512 MB RAM, 0.1 CPU.
# Debian's stock apache2.conf allows MaxRequestWorkers 150. With mod_php
# every worker is a complete PHP process holding its own opcache and a
# fresh framework bootstrap (roughly 40-60 MB resident), so 150 workers
# would demand several gigabytes against a 512 MB box and get OOM-killed
# under any burst. Four workers keeps the process footprint inside the
# budget and matches the 0.1 CPU reality: the box cannot use more
# parallelism than that anyway.
#
# This file is installed into /etc/apache2/conf-enabled/, which Debian's
# apache2.conf includes *after* its own MPM block, so these values win.

<IfModule mpm_prefork_module>
    StartServers           2
    MinSpareServers        2
    MaxSpareServers        4
    MaxRequestWorkers      4
    # Recycle a worker after this many connections so a slow leak in one
    # request cannot accumulate across a long-lived child.
    MaxConnectionsPerChild 500
</IfModule>

<IfModule mpm_worker_module>
    StartServers           2
    MinSpareThreads        25
    MaxSpareThreads        75
    ThreadsPerChild        25
    MaxRequestWorkers      4
    MaxConnectionsPerChild 500
</IfModule>

<IfModule mpm_event_module>
    StartServers           2
    MinSpareThreads        25
    MaxSpareThreads        75
    ThreadsPerChild        25
    MaxRequestWorkers      4
    MaxConnectionsPerChild 500
</IfModule>

# The extension polls the same host on a fixed cadence, so reusing the
# connection avoids a fresh TLS handshake on every request.
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# A request that is still running after this long is holding one of only
# four workers hostage; fail it instead of starving the queue.
Timeout 60

# The signed policy feed the extension polls is large, repetitive JSON and
# compresses extremely well.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json application/javascript text/css text/html text/plain application/xml image/svg+xml
    DeflateCompressionLevel 6
    DeflateWindowSize 15
    DeflateMemLevel 8
    DeflateBufferSize 8192
</IfModule>

# Vite emits content-hashed filenames under /build, so the bytes behind a
# given URL can never change.
<Location /build>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</Location>

# Never advertise the exact server version.
ServerTokens Prod
ServerSignature Off
