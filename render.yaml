services:
  - type: web
    name: able-server-admin
    runtime: docker
    dockerfilePath: ./Server-Admin/Dockerfile
    dockerContext: ./Server-Admin
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "ABLE - Shadow IT Prevention and Egress Data Monitoring"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: ABLE_SIGNING_KEY
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
