databases:
  - name: able-postgres
    plan: free
    region: singapore
    databaseName: able
    user: able_user

services:
  - type: web
    name: able-server-admin
    runtime: docker
    dockerfilePath: ./Server-Admin/Dockerfile
    dockerContext: ./Server-Admin
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "ABLE - Shadow IT Prevention and Egress Data Monitoring"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: ABLE_SIGNING_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: able-postgres
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
